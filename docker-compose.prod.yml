# Production stack for the Raspberry Pi (see docs/deploy-pi.md). Reads variables from .env next to this file.
# Postgres is NOT part of this stack: DATABASE_URL points at the existing server on the network.
# Only Caddy is reachable from the LAN; the app lives on the internal compose network.
name: project-tracker

services:
  # The single image serving /api and the built web app. Runs migrations on startup.
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      NODE_ENV: production
      # Behind Caddy: trust X-Forwarded-For so login rate limiting sees real client addresses.
      TRUST_PROXY: "true"
    expose:
      - "3000"
    restart: unless-stopped

  # TLS termination with a Let's Encrypt certificate obtained via the Cloudflare DNS challenge.
  caddy:
    build: ./deploy/caddy
    depends_on:
      app:
        condition: service_healthy
    environment:
      TRACKER_HOSTNAME: ${TRACKER_HOSTNAME:?set TRACKER_HOSTNAME in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
    ports:
      # 80 and 443 are taken by Pi-hole's web admin on the Pi, so HTTPS is served on 8443.
      - "8443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
