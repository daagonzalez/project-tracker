# Production stack for the Raspberry Pi (see docs/deploy-pi.md). Reads variables from .env next to this file.
# Only Caddy is reachable from the LAN; the app and database live on the internal compose network.
name: project-tracker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The single image serving /api and the built web app. Runs migrations on startup.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}
      NODE_ENV: production
      # Behind Caddy: trust X-Forwarded-For so login rate limiting sees real client addresses.
      TRUST_PROXY: "true"
    expose:
      - "3000"
    restart: unless-stopped

  # TLS termination with a Let's Encrypt certificate obtained via the Cloudflare DNS challenge.
  caddy:
    build: ./deploy/caddy
    depends_on:
      app:
        condition: service_healthy
    environment:
      TRACKER_HOSTNAME: ${TRACKER_HOSTNAME:?set TRACKER_HOSTNAME in .env}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
    ports:
      # 80 and 443 are taken by Pi-hole's web admin on the Pi, so HTTPS is served on 8443.
      - "8443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  dbdata:
  caddy_data:
  caddy_config:
